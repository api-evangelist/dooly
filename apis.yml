name: Dooly
description: >-
  Dooly was a connected workspace for revenue teams that improved Salesforce
  CRM hygiene by syncing meeting notes, pipeline updates, and next steps back
  into Salesforce automatically. It layered a fast note-taking surface, deal
  vitals, real-time playbooks, and one-click CRM updates on top of Salesforce so
  account executives could keep their pipeline clean without manual data entry.
  Backed by Battery Ventures, Dooly was added to the API Evangelist network as a
  portfolio lead. The Dooly platform was shut down on June 30, 2025; the company
  publishes no public developer API, SDKs, or developer portal, and this profile
  captures the remaining public surface (website, privacy policy, terms) for the
  record.
